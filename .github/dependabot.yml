# Keep the CI/release workflow actions current (and SHA-pinned — see distribution-integrity D2).
# Only github-actions applies here: the .NET build dependencies live in the BepInEx /
# Il2CppInterop forks (fetched by CI), not in this distribution repo, so there is no NuGet
# manifest here for Dependabot to track. Add a `nuget` ecosystem if/when project files are vendored in.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # github/codeql-action ships init + analyze as separate actions from one release train.
      # Bumping them in separate PRs (2026-09, #20+#22) mismatches the SARIF config-file version
      # init writes vs the version analyze expects to read — a run fails with "Loaded a
      # configuration file for version 'X', but running version 'Y'" even though each PR is
      # individually green. Group so they always land — and merge — together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
