# Upstream watcher — monthly poll of the tracked upstreams, runs FREE on GitHub Actions.
# It is independent of any Claude subscription or local machine: as long as this repo exists,
# GitHub runs it. When a tracked upstream moves past the recorded baseline it opens (or comments
# on) an issue. Bump the baselines below when a move is reviewed/adopted.
name: watch-upstream

on:
  schedule:
    - cron: '0 6 1 * *'      # monthly, 1st @ 06:00 UTC — matches BepInEx master cadence (~6 commits/yr, ~1 per 2 months)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  # Baselines (2026-06-05) — update when a move is adopted. Track master HEAD, not releases/latest
  # (which returns BepInEx's Mono 5.x and a stale Il2CppInterop tag — misleading for the IL2CPP stack).
  BEPINEX_BASE: '5b766a3'         # BepInEx/BepInEx master — last reviewed 2026-09-17. release.yml pulls master
                                   # live on every run, so a move is already IN each auto-release before this
                                   # watcher even fires; bump this baseline as a review checkpoint, not a gate.
  INTEROP_BASE: '81a6f78'         # BepInEx/Il2CppInterop master — our component (re-vendored 2026-07-08) already
                                   # sits AT this commit (#266 + our merged #267), so no fork-delta to reconcile.
  IMAT_CORE_BASE: '2026-08-16'    # ImaterialC src/BepInEx/core last-commit date (game-moved signal)
  DOORSTOP_BASE: '4.5.0'          # NeighTools/UnityDoorstop latest release — the dxgi proxy we ship (fetched dep)
  CPP2IL_BASE: '2022.1.0-pre-release.21'  # SamboyCoding/Cpp2IL newest release (incl. pre-release) — our pinned IL2CPP
                                          # metadata parser (fetched NuGet). Poll the release TAG, not master: metadata-
                                          # version support (v39 etc.) lands in releases. A new tag = a possible metadata
                                          # bump → review + bump Samboy063.Cpp2IL.Core in BepInEx.Unity.IL2CPP.csproj.

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check tracked upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bep=$(gh api repos/BepInEx/BepInEx/commits/master --jq '.sha' | cut -c1-7)
          intr=$(gh api repos/BepInEx/Il2CppInterop/commits/master --jq '.sha' | cut -c1-7)
          imat=$(gh api 'repos/ImaterialC/PriconneRe-TL/commits?path=src/BepInEx/core&per_page=1' --jq '.[0].commit.author.date' | cut -c1-10)
          door=$(gh api repos/NeighTools/UnityDoorstop/releases/latest --jq '.tag_name' | sed 's/^v//')
          cpp=$(gh api 'repos/SamboyCoding/Cpp2IL/releases?per_page=1' --jq '.[0].tag_name')
          : > moved.md
          [ "$bep"  != "$BEPINEX_BASE" ]   && echo "- **BepInEx** master moved: \`$BEPINEX_BASE\` → \`$bep\` — review for fixes to pull into our fork." >> moved.md || true
          [ "$intr" != "$INTEROP_BASE" ]   && echo "- **Il2CppInterop** master moved: \`$INTEROP_BASE\` → \`$intr\` — review for fixes to pull into our fork." >> moved.md || true
          [ "$imat" != "$IMAT_CORE_BASE" ] && echo "- **ImaterialC** loader (\`src/BepInEx/core\`) changed: $IMAT_CORE_BASE → $imat — the game likely moved; re-verify our \`core\` boots + regen interop if stale." >> moved.md || true
          [ "$door" != "$DOORSTOP_BASE" ] && echo "- **UnityDoorstop** released \`$DOORSTOP_BASE\` → \`$door\` — the doorstop proxy we fetch + ship; review + bump DoorstopVersion in the Cake build." >> moved.md || true
          [ "$cpp"  != "$CPP2IL_BASE" ]   && echo "- **Cpp2IL** released \`$CPP2IL_BASE\` → \`$cpp\` — our pinned IL2CPP metadata parser; a new tag may add a metadata version. Review + bump \`Samboy063.Cpp2IL.Core\` in \`BepInEx.Unity.IL2CPP.csproj\` if the game's metadata version moved." >> moved.md || true
          if [ -s moved.md ]; then
            { echo "Tracked upstreams moved (monthly watch):"; echo; cat moved.md; echo; \
              echo "After reviewing, bump the baselines in \`.github/workflows/watch-upstream.yml\`."; } > body.md
            num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Upstream moved in:title" --json number --jq '.[0].number // empty')
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file body.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "🔭 Upstream moved — review" --body-file body.md
            fi
          else
            echo "No upstream movement since baseline."
          fi
