# Auto-track ImaterialC's interop. Every 6h: if ImaterialC published a newer interop than our latest
# interop-* release, fetch ONLY their generated interop (game-derived TYPE METADATA, credited), cut a
# new interop-<tag> release, then CALL release.yml (same run) to build + publish a matching loader release.
# All on GitHub — no local clones. Interop sourcing per docs (ImaterialC GitHub-direct).
# Cross-workflow note: GITHUB_TOKEN cannot fire a workflow_dispatch (loop-guard), so we use workflow_call.
name: auto-interop

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write            # create the interop-* release; the called release.yml creates the loader release

jobs:
  check-and-bundle:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
      itag: ${{ steps.check.outputs.itag }}
      rtag: ${{ steps.check.outputs.rtag }}
    steps:
      - name: Detect a newer ImaterialC interop
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          imat=$(gh api repos/ImaterialC/PriconneRe-TL/releases --jq 'max_by(.created_at).tag_name')
          ours=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                   --jq '[.[].tag_name | select(startswith("interop-"))] | sort | last // ""')
          echo "ImaterialC latest = '$imat' | our latest interop = '${ours:-none}'"
          if [ -z "$imat" ] || [ "interop-$imat" = "$ours" ]; then
            echo "Up to date (or no ImaterialC release found) — nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New ImaterialC interop: $imat"
            { echo "new=true"; echo "itag=interop-$imat"; echo "rtag=6.0.0-priconne-$imat"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch + bundle the interop, cut the interop-* release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          imat="${{ steps.check.outputs.itag }}"; imat="${imat#interop-}"
          # Sparse, shallow checkout of ONLY ImaterialC's interop dir at their release tag.
          git clone --depth 1 --branch "$imat" --filter=blob:none --sparse \
            https://github.com/ImaterialC/PriconneRe-TL.git imat
          git -C imat sparse-checkout set src/BepInEx/interop
          test -d imat/src/BepInEx/interop || { echo "::error::ImaterialC interop dir missing at tag $imat"; exit 1; }
          mkdir stage
          cp -r imat/src/BepInEx/interop/. stage/
          printf '%s\n' \
            "IL2CPP interop assemblies generated by ImaterialC (PriconneRe-TL release $imat)," \
            "re-hosted for the BepInEx.Priconne loader with attribution. Game-derived type metadata," \
            "NOT Cygames content. Prefer ImaterialC's repository for the authoritative copy." \
            > stage/NOTICE-interop.txt
          ( cd stage && zip -qr ../interop.zip . )
          gh release create "${{ steps.check.outputs.itag }}" interop.zip \
            --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "interop $imat (ImaterialC, re-hosted)" \
            --notes "Auto-fetched ImaterialC interop $imat. Game-derived type metadata, not Cygames content. See NOTICE-interop.txt."

  # Build + publish a loader release that bundles the freshly-cut interop. workflow_call = same run, no PAT.
  release:
    needs: check-and-bundle
    if: needs.check-and-bundle.outputs.new == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check-and-bundle.outputs.rtag }}
      interop_tag: ${{ needs.check-and-bundle.outputs.itag }}
